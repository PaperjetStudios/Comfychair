<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>ComfyDeck</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Comfy<b>Deck</b></div>
    <select id="projectSel" aria-label="Project"></select>
    <nav class="tabs" role="tablist">
      <button data-tab="generate" role="tab" title="Generate" class="active" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span class="tab-label">Generate</span><span class="tab-chip hidden" id="runChip"></span></button>
      <button data-tab="editor" role="tab" title="Editor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg><span class="tab-label">Editor</span></button>
      <button data-tab="video" role="tab" title="Video"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></svg><span class="tab-label">Video</span></button>
      <button data-tab="sound" role="tab" title="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span class="tab-label">Sound</span></button>
      <button data-tab="vfx" role="tab" title="VFX"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L14 10"/><path d="M15 3l1 2.5L18.5 6.5 16 7.5 15 10l-1-2.5L11.5 6.5 14 5.5z"/><path d="M19.5 11l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg><span class="tab-label">VFX</span></button>
      <button data-tab="scene" role="tab" title="3D"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M3.5 7.3L12 12l8.5-4.7M12 12v9.5"/></svg><span class="tab-label">3D</span></button>
      <button data-tab="board" role="tab" title="Board"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="tab-label">Board</span></button>
      <button data-tab="history" role="tab" title="History"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="tab-label">History</span></button>
    </nav>
    <div class="status">
      <button id="jobsBtn" class="btn small queue-btn" title="Queue and run times">Queue<span id="queueInfo" class="queue-info"></span></button>
      <button id="prefsBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
      <button id="fsBtn" class="icon-btn" title="Full screen" aria-label="Full screen">⛶</button>
      <button id="debugBtn" class="icon-btn" title="Websocket log" aria-label="Websocket log">⋯</button>
      <span id="connDot" class="dot" title="ComfyUI connection"></span>
    </div>
  </header>

  <main>
    <section id="tab-generate" class="tab active">
      <div class="stage">
        <div class="viewer" id="viewer">
          <div id="zoomLayer" class="zoom-layer">
            <canvas id="previewCanvas" class="hidden"></canvas>
            <div id="viewerMedia" class="viewer-media"><div class="placeholder">Output and live previews appear here</div></div>
          </div>
          <div class="zoom-ctl">
            <button id="zoomOut" class="icon-btn" aria-label="Zoom out">−</button>
            <button id="zoomReset" class="icon-btn" aria-label="Reset zoom">1:1</button>
            <button id="zoomIn" class="icon-btn" aria-label="Zoom in">+</button>
          </div>
          <div class="viewer-badge hidden" id="viewerBadge">LIVE</div>
        </div>
        <div class="progress"><div class="bar" id="progBar"></div><span id="progText"></span></div>
        <div class="stages hidden" id="stageBar"></div>
        <div class="strip" id="outStrip"></div>
      </div>
      <div class="splitter" role="separator" aria-label="Drag to resize preview and settings" title="Drag to resize · double-tap to reset"></div>
      <aside class="panel">
        <div class="tpl-row tpl-filter">
          <select id="tplType" aria-label="Show templates that make"></select>
          <select id="tplFam" aria-label="Show templates for the model"></select>
        </div>
        <div class="tpl-row">
          <select id="tplSel" aria-label="Template"></select>
          <button id="reloadTpl" class="icon-btn" title="Reload templates and model lists" aria-label="Reload templates">↻</button>
        </div>
        <div id="tplNotes"></div>
        <form id="fields" onsubmit="return false"></form>
      </aside>
    </section>

    <section id="tab-editor" class="tab">
      <div class="stage editor-stage">
        <div class="viewer">
          <canvas id="editorCanvas" class="hidden"></canvas>
          <div id="editorEmpty" class="placeholder">Add images to crop and join them</div>
        </div>
        <div class="progress"><span id="editorSize"></span></div>
      </div>
      <div class="splitter" role="separator" aria-label="Drag to resize preview and settings" title="Drag to resize · double-tap to reset"></div>
      <aside class="panel" id="editorPanel"></aside>
    </section>

    <section id="tab-video" class="tab">
      <div class="stage editor-stage">
        <div class="viewer">
          <canvas id="vidCanvas"></canvas>
          <div id="vidEmpty" class="placeholder">Add clips, images or sound to the timeline</div>
        </div>
        <div class="transport">
          <button id="vidStart" class="icon-btn" aria-label="Go to start" title="Go to start (Home)">⇤</button>
          <button id="vidPrev" class="icon-btn" aria-label="Back one frame" title="Back one frame (←)">⏮</button>
          <button id="vidPlay" class="btn small primary" title="Play / pause (Space)">▶ Play</button>
          <button id="vidNext" class="icon-btn" aria-label="Forward one frame" title="Forward one frame (→)">⏭</button>
          <button id="vidLoop" class="btn small" aria-pressed="false">⟲ Loop</button>
          <button id="vidSnap" class="btn small" title="Save this frame as an image">📷 Frame</button>
          <span id="vidLoad" class="hint"></span>
          <span id="vidTime" class="timecode"></span>
        </div>
      </div>
      <div class="splitter" role="separator" aria-label="Drag to resize preview and settings" title="Drag to resize · double-tap to reset"></div>
      <aside class="panel" id="videoPanel"></aside>
      <div class="timeline-wrap">
        <div class="hsplit" role="separator" aria-label="Drag to resize the timeline" title="Drag to resize · double-tap to reset"></div>
        <div class="tl-tools" id="tlTools"></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <section id="tab-sound" class="tab">
      <div class="stage editor-stage">
        <div class="viewer snd-viewer">
          <canvas id="sndCanvas" aria-label="The whole mix: tap to move the playhead"></canvas>
          <div id="sndEmpty" class="placeholder">Add sounds, or the sound of clips, to the tracks below</div>
        </div>
        <div class="transport">
          <button id="sndStart" class="icon-btn" aria-label="Go to start" title="Go to start (Home)">⇤</button>
          <button id="sndBack" class="icon-btn" aria-label="Back 5 seconds" title="Back 5 s">⏪</button>
          <button id="sndPlay" class="btn small primary" title="Play / pause (Space)">▶ Play</button>
          <button id="sndFwd" class="icon-btn" aria-label="Forward 5 seconds" title="Forward 5 s">⏩</button>
          <button id="sndLoop" class="btn small" aria-pressed="false">⟲ Loop</button>
          <span id="sndTime" class="timecode"></span>
        </div>
      </div>
      <div class="splitter" role="separator" aria-label="Drag to resize preview and settings" title="Drag to resize · double-tap to reset"></div>
      <aside class="panel" id="soundPanel"></aside>
      <div class="timeline-wrap">
        <div class="hsplit" role="separator" aria-label="Drag to resize the timeline" title="Drag to resize · double-tap to reset"></div>
        <div class="tl-tools" id="sndTools"></div>
        <div class="timeline" id="sndTimeline"></div>
      </div>
    </section>

    <section id="tab-vfx" class="tab">
      <div class="stage editor-stage">
        <div class="viewer"><div id="vfxStage" class="vfx-stage"></div></div>
        <div class="transport" id="vfxTransport"></div>
      </div>
      <div class="splitter" role="separator" aria-label="Drag to resize preview and settings" title="Drag to resize · double-tap to reset"></div>
      <aside class="panel" id="vfxPanel"></aside>
    </section>

    <section id="tab-scene" class="tab">
      <div class="stage editor-stage">
        <div class="viewer" id="sceneViewer"><canvas id="sceneCanvas"></canvas></div>
        <div class="transport scene-transport" id="sceneTransport"></div>
      </div>
      <div class="splitter" role="separator" aria-label="Drag to resize preview and settings" title="Drag to resize · double-tap to reset"></div>
      <aside class="panel" id="scenePanel"></aside>
    </section>

    <section id="tab-board" class="tab">
      <div class="board-bar" id="boardBar"></div>
      <div class="board" id="board"></div>
    </section>

    <section id="tab-history" class="tab">
      <div class="grid" id="historyGrid"></div>
      <button id="moreHistory" class="btn ghost more hidden">Load more</button>
    </section>
  </main>

  <footer class="actionbar">
    <div class="stepper batch" title="Batch count">
      <button id="batchMinus" aria-label="Fewer">−</button><span id="batchVal">1</span><button id="batchPlus" aria-label="More">+</button>
    </div>
    <button id="stopBtn" class="btn ghost">Stop</button>
    <button id="genBtn" class="btn primary">Generate</button>
  </footer>

  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="busy" class="busy hidden" role="status" aria-live="polite"><div class="busy-track"><div class="busy-fill"></div></div><span class="busy-label"></span></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="connBanner" class="conn-banner hidden" role="alert"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
